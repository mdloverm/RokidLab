#
# Crowdin 配置文件
# https://crowdin.com/project/rokidlab
#
# 使用方法：
#   1. 在 Crowdin 上创建项目（https://crowdin.com/projects）
#   2. 安装 Crowdin CLI: npm install -g @crowdin/cli
#   3. 设置 API Token: export CROWDIN_PERSONAL_TOKEN="your_token"
#   4. 上传源文件: crowdin upload sources
#   5. 下载翻译: crowdin download
#
# 文件结构：
#   res/values/strings.xml            <- 源语言（中文简体）
#   res/values-{lang}/strings.xml     <- 翻译文件（Crowdin 自动生成）
#

"project_id": "0"  # TODO: 替换为你的 Crowdin 项目 ID
"api_token": ""     # TODO: 设置环境变量 CROWDIN_PERSONAL_TOKEN

"base_path": "."

"preserve_hierarchy": true

files: [
  {
    "source": "phone-app/src/main/res/values/strings.xml",
    "translation": "phone-app/src/main/res/values-%two_letters_code%/strings.xml",
    "type": "android",
    "update_option": "update_as_unapproved"
  }
]
