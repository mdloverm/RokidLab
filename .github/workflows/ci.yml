name: CI

# 推送到 master / 面向 master 的 PR：双端 debug 构建 + 单元测试。
# （release 构建走 release.yml，含签名与发布门禁；此处只验证源码可编译、单测全绿。）

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: debug 构建 + 单测（双端）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（自动缓存依赖）
        uses: gradle/actions/setup-gradle@v4

      - name: 生成 gradle.properties（CI 模板，不含签名口令）
        run: cp gradle.properties.example gradle.properties

      - name: 双端 debug 构建 + 单元测试
        run: bash ./gradlew --stacktrace :phone-app:assembleDebug :RokidLink:assembleDebug :phone-app:testDebugUnitTest :RokidLink:testDebugUnitTest

      - name: 收集单测报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            phone-app/build/outputs/apk/debug/*.apk
            RokidLink/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn
